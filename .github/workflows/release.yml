name: GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  release:
    name: Verify, package, and create draft-free release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:release "${GITHUB_REF_NAME}"
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm check
      - run: pnpm test:performance
      - run: pnpm test:soak
      - run: pnpm test:coverage
      - run: pnpm audit --audit-level high
      - run: pnpm run licenses
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm build:firefox
      - run: pnpm validate:build
      - run: pnpm validate:permission-warnings
      - run: pnpm scan:artifacts
      - run: pnpm zip
      - run: pnpm zip:firefox
      - run: pnpm package:artifacts
      - run: pnpm validate:packages
      - run: pnpm validate:source-rebuild
      - run: cd .output && sha256sum ProxyLoom-*.zip > SHA256SUMS
      - name: Create or verify one GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          pnpm publish:github-release "${GITHUB_REF_NAME}"
          .output/ProxyLoom-*.zip .output/SHA256SUMS
