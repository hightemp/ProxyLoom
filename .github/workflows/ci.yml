name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  quality:
    name: Quality and unit gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm validate:docs
      - run: pnpm spellcheck
      - run: pnpm validate:workflows
      - run: pnpm validate:store-assets
      - run: pnpm validate:traceability
      - run: pnpm test:unit
      - run: pnpm test:parity
      - run: pnpm test:performance
      - run: pnpm test:coverage
      - run: pnpm audit --audit-level high
      - run: pnpm run licenses

  browser-tests:
    name: Local proxy browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - name: Verify failure traces contain no privacy canaries
        id: trace_safety
        if: failure()
        run: pnpm scan:test-artifacts
      - name: Upload safe failure traces
        if: failure() && steps.trace_safety.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  packages:
    name: Dual MV3 packages
    needs: [quality, browser-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:firefox
      - run: pnpm validate:build
      - run: pnpm scan:artifacts
      - run: pnpm zip
      - run: pnpm zip:firefox
      - run: pnpm package:artifacts
      - run: pnpm validate:packages
      - run: pnpm validate:source-rebuild
      - run: cd .output && sha256sum ProxyLoom-*.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: proxyloom-${{ github.sha }}
          path: |
            .output/ProxyLoom-*.zip
            .output/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
